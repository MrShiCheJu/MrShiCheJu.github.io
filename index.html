<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>毛心妍 生日快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            background: url('https://p26-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/c950f8edfcc6416582ef05c4985ad819.png~tplv-a9rns2rl98-24:720:720.png?rcl=202601072119538DFEABC44ACC7567F8C6&rk3s=8e244e95&rrcfp=8a172a1a&x-expires=1768396793&x-signature=1XZ6jINT6vmoeMEzisKfkqjQco0%3D') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 刮刮乐样式 */
        .scratch-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
            z-index: 1000;
            /* 初始隐藏刮刮乐 */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: translate(-50%, -50%) scale(0.8);
        }

        /* 刮刮乐显示动画 */
        .scratch-show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .scratch-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .scratch-header h1 {
            color: #e63946;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .scratch-header .chance {
            font-size: 1.1rem;
            color: #457b9d;
            font-weight: bold;
            background: #f1faee;
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-block;
        }

        .scratch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .scratch-card {
            position: relative;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .scratch-card:hover {
            transform: translateY(-3px);
        }

        .scratch-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #d6ccc2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #6b705c;
            z-index: 2;
            user-select: none;
        }

        .prize-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            z-index: 1;
            padding: 10px;
            text-align: center;
        }

        .prize-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2b2d42;
            margin-bottom: 5px;
        }

        .prize-tip {
            font-size: 0.8rem;
            color: #8d99ae;
        }

        .prize-success {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
        }

        .prize-fail {
            background: linear-gradient(135deg, #ffd6a5 0%, #ffc898 100%);
        }

        .message {
            text-align: center;
            font-size: 1.1rem;
            color: #2b2d42;
            padding: 15px;
            border-radius: 10px;
            background: #fefae0;
            margin-top: 10px;
            display: none;
        }

        .restart-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
            display: none;
        }

        .restart-btn:hover {
            background: #d62828;
        }

        /* 刮开动画 */
        @keyframes scratchOpen {
            0% { width: 100%; }
            100% { width: 0%; }
        }

        .scratched {
            animation: scratchOpen 0.5s forwards;
        }

        /* 便签样式 */
        .note {
            position: absolute;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transform: rotate(var(--rotate));
            font-size: 14px;
            opacity: 0;
            transition: all 0.8s ease;
            z-index: 10;
            backdrop-filter: blur(2px);
            font-weight: 500;
        }

        /* 核心祝福样式 */
        .core-note {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            font-size: 18px;
            font-weight: bold;
            color: #2d3436;
            opacity: 0;
            z-index: 100;
            text-align: center;
            max-width: 80%;
        }

        /* 加载提示 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 16px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            display: block;
        }

        /* 核心祝福隐藏动画 */
        @keyframes hideCoreNote {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }

        .core-note-hidden {
            animation: hideCoreNote 0.8s forwards;
        }
    </style>
</head>
<body>
    <!-- 刮刮乐容器 -->
    <div class="scratch-container" id="scratchContainer">
        <div class="scratch-header">
            <h1>生日快乐 🎉</h1>
            <div class="chance">剩余刮奖次数：<span id="remainingChances">3</span>次</div>
        </div>
        
        <div class="scratch-grid" id="scratchGrid">
            <!-- 刮刮乐格子会通过JS动态生成 -->
        </div>
        
        <div class="message" id="message"></div>
        <button class="restart-btn" id="restartBtn">重新开始</button>
    </div>

    <!-- 祝福相关元素 -->
    <div class="loading">正在准备生日祝福...</div>
    <div class="core-note" id="coreNote"></div>

    <script>
        // 刮刮乐相关代码
        // 奖品配置
        const prizes = [
            { name: '拼豆豆套装', type: 'success' },
            { name: '沈星回周边', type: 'success' },
            { name: '香水', type: 'success' },
            { name: '向日葵', type: 'success' },
            { name: '再接再厉', type: 'fail' },
            { name: '再接再厉', type: 'fail' }
        ];

        // 刮刮乐全局变量
        let remainingChances = 3;
        let scratchedCards = new Set();
        const scratchGrid = document.getElementById('scratchGrid');
        const remainingChancesEl = document.getElementById('remainingChances');
        const messageEl = document.getElementById('message');
        const restartBtn = document.getElementById('restartBtn');
        const scratchContainer = document.getElementById('scratchContainer');

        // 初始化刮刮乐格子
        function initScratchCards() {
            scratchGrid.innerHTML = '';
            const shuffledPrizes = [...prizes].sort(() => Math.random() - 0.5);
            
            shuffledPrizes.forEach((prize, index) => {
                const card = document.createElement('div');
                card.className = 'scratch-card';
                card.dataset.index = index;
                
                const prizeContent = document.createElement('div');
                prizeContent.className = `prize-content prize-${prize.type}`;
                // 关键修改：替换提示文字
                prizeContent.innerHTML = `
                    <div class="prize-name">${prize.name}</div>
                    <div class="prize-tip">记得将喜悦截图分享于我兑换好运哦~</div>
                `;
                
                const cover = document.createElement('div');
                cover.className = 'scratch-cover';
                cover.textContent = '刮开有奖';
                
                card.appendChild(prizeContent);
                card.appendChild(cover);
                card.addEventListener('click', handleScratch);
                scratchGrid.appendChild(card);
            });
        }

        // 处理刮奖逻辑
        function handleScratch(e) {
            const card = e.currentTarget;
            const index = card.dataset.index;
            
            if (scratchedCards.has(index) || remainingChances <= 0) {
                showMessage(remainingChances <= 0 ? '刮奖次数已用完！' : '这个格子已经刮过啦～', 'warning');
                return;
            }
            
            remainingChances--;
            remainingChancesEl.textContent = remainingChances;
            scratchedCards.add(index);
            
            const cover = card.querySelector('.scratch-cover');
            cover.classList.add('scratched');
            
            const prizeName = card.querySelector('.prize-name').textContent;
            
            if (prizeName === '再接再厉') {
                showMessage(`很遗憾，获得「${prizeName}」`, 'info');
            } else {
                showMessage(`恭喜！获得「${prizeName}」🎉`, 'success');
            }
            
            // 次数用完后显示重新开始按钮
            if (remainingChances <= 0) {
                setTimeout(() => {
                    showMessage('刮奖次数已用完，点击下方按钮可重新开始～', 'info');
                    restartBtn.style.display = 'block';
                }, 1000);
            }
        }

        // 显示提示信息
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.style.display = 'block';
            messageEl.style.background = type === 'success' ? '#e8f5e9' : 
                                         type === 'warning' ? '#fff3cd' : '#e8f4f8';
            messageEl.style.color = type === 'success' ? '#2e7d32' : 
                                    type === 'warning' ? '#856404' : '#0c5460';
            
            clearTimeout(window.messageTimer);
            window.messageTimer = setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }

        // 重新开始游戏
        function restartGame() {
            remainingChances = 3;
            scratchedCards.clear();
            remainingChancesEl.textContent = remainingChances;
            messageEl.style.display = 'none';
            restartBtn.style.display = 'none';
            initScratchCards();
        }

        // 绑定重新开始按钮事件
        restartBtn.addEventListener('click', restartGame);

        // 显示刮刮乐
        function showScratchGame() {
            const coreNote = document.getElementById('coreNote');
            // 隐藏核心祝福
            coreNote.classList.add('core-note-hidden');
            
            // 延迟显示刮刮乐
            setTimeout(() => {
                scratchContainer.classList.add('scratch-show');
                // 初始化刮刮乐
                initScratchCards();
            }, 1000);
        }

        // 祝福动画相关代码
        // 自定义名字
        const name = "毛心妍";
        
        // 生日祝福诗句库
        const blessings = [
            `${name}生辰至，喜乐满庭芳`,
            `岁岁常欢愉，年年皆胜意 | 祝${name}生日快乐`,
            `嘉辰逢吉乐，福寿与天长 | 贺${name}生辰`,
            `${name}今辰喜，清风绕玉堂`,
            `生辰多胜意，岁岁拥安康 | 致${name}`,
            `年华添锦绣，日月伴清欢 | 祝${name}生日快乐`,
            `${name}生辰乐，星河皆为贺`,
            `一岁一礼，一寸欢喜 | 贺${name}生辰`,
            `春祺夏安，秋绥冬宁 | 祝${name}岁岁顺遂`,
            `朝朝暮暮，岁岁年年 | 愿${name}平安喜乐`,
            `${name}生辰吉，万事皆可期`,
            `星河璀璨，岁岁无忧 | 贺${name}生日快乐`,
            `良辰逢吉庆，福寿永康宁 | 致${name}`,
            `${name}今岁乐，来年更胜前`,
            `浮生偷得半日闲，生辰喜乐胜从前 | 祝${name}`,
            `岁岁年年，万喜万般宜 | 贺${name}生辰`,
            `${name}生辰喜，清风拂面来`,
            `如月之恒，如日之升 | 祝${name}前程似锦`,
            `喜乐长安宁，生辰多胜意 | 致${name}`,
            `${name}生辰至，花开满路香`,
            `四时皆如意，生辰乐无忧 | 贺${name}`,
            `年年有今日，岁岁有今朝 | 祝${name}生日快乐`,
            `${name}生辰吉，所求皆如愿`,
            `山河远阔，人间烟火 | 愿${name}岁岁安澜`,
            `生辰添福寿，欢笑伴流年 | 致${name}`,
            `${name}今辰乐，万事顺心意`,
            `温软人间，岁岁年年 | 贺${name}生辰`,
            `平安喜乐，得偿所愿 | 祝${name}生日快乐`,
            `${name}生辰喜，岁月皆温柔`,
            `以梦为马，不负韶华 | 致${name}生辰`,
            `岁岁常欢愉，万事皆胜意 | 贺${name}`,
            `${name}生辰至，好运常相伴`,
            `吉时逢生辰，喜乐伴终身 | 祝${name}`,
            `时光恰好，生辰如期 | 致${name}生日快乐`,
            `${name}今岁喜，步步皆生花`,
            `一生明朗，一路追光 | 贺${name}生辰`,
            `生辰悦乐，四季平安 | 祝${name}岁岁顺遂`,
            `${name}生辰吉，喜乐永相随`,
            `日子滚烫，我们来日方长 | 致${name}`,
            `生辰有清欢，岁岁有安暖 | 贺${name}`,
            `${name}今辰庆，福气绕身旁`,
            `岁岁年年，温柔以待 | 祝${name}生日快乐`
        ];

        // 彩色便签配色方案
        const noteColors = [
            { bg: 'rgba(255, 240, 245, 0.9)', text: '#e91e63' },
            { bg: 'rgba(224, 247, 250, 0.9)', text: '#0097a7' },
            { bg: 'rgba(241, 248, 233, 0.9)', text: '#558b2f' },
            { bg: 'rgba(255, 248, 225, 0.9)', text: '#f57f17' },
            { bg: 'rgba(234, 226, 243, 0.9)', text: '#7b1fa2' },
            { bg: 'rgba(250, 235, 215, 0.9)', text: '#8d6e63' },
            { bg: 'rgba(255, 235, 238, 0.9)', text: '#c62828' },
            { bg: 'rgba(228, 248, 255, 0.9)', text: '#0277bd' }
        ];

        // 屏幕尺寸
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        // 加载提示和核心祝福元素
        const loading = document.querySelector('.loading');
        const coreNote = document.getElementById('coreNote');
        coreNote.innerText = `${name}，生日快乐！岁岁皆顺遂，年年有欢喜～`;

        // 创建便签函数
        function createNotes() {
            loading.style.display = 'none';
            
            const noteCount = Math.floor(Math.random() * 40) + 80;
            let createdCount = 0;
            
            const createInterval = setInterval(() => {
                if (createdCount >= noteCount) {
                    clearInterval(createInterval);
                    setTimeout(convergeNotes, 2000);
                    return;
                }

                const note = document.createElement('div');
                note.className = 'note';
                
                const randomBlessing = blessings[Math.floor(Math.random() * blessings.length)];
                note.innerText = randomBlessing;
                
                const randomColor = noteColors[Math.floor(Math.random() * noteColors.length)];
                note.style.backgroundColor = randomColor.bg;
                note.style.color = randomColor.text;
                
                const left = Math.random() * (screenWidth - 120) + 10;
                const top = Math.random() * (screenHeight - 80) + 10;
                
                const rotate = (Math.random() - 0.5) * 30;
                
                note.style.left = `${left}px`;
                note.style.top = `${top}px`;
                note.style.setProperty('--rotate', `${rotate}deg`);
                
                document.body.appendChild(note);
                
                setTimeout(() => {
                    note.style.opacity = 1;
                }, Math.random() * 500);

                createdCount++;
            }, 30);
        }

        // 便签收敛函数
        function convergeNotes() {
            const notes = document.querySelectorAll('.note');
            let convergeCount = 0;
            
            notes.forEach((note, index) => {
                setTimeout(() => {
                    note.style.left = `${screenWidth / 2}px`;
                    note.style.top = `${screenHeight / 2}px`;
                    note.style.opacity = 0;
                    note.style.transform = `translate(-50%, -50%) rotate(0deg) scale(0.5)`;
                    
                    convergeCount++;
                    if (convergeCount === notes.length) {
                        setTimeout(() => {
                            notes.forEach(n => n.remove());
                            coreNote.style.opacity = 1;
                            // 核心祝福显示3秒后，显示刮刮乐
                            setTimeout(() => {
                                coreNote.style.transform = 'translate(-50%, -50%) scale(1.1)';
                                setTimeout(() => {
                                    coreNote.style.transform = 'translate(-50%, -50%) scale(1)';
                                    // 核心祝福停留2秒后切换到刮刮乐
                                    setTimeout(showScratchGame, 2000);
                                }, 500);
                            }, 300);
                        }, 800);
                    }
                }, index * 15);
            });
        }

        // 启动祝福动画
        function startBlessingAnimation() {
            loading.style.display = 'block';
            setTimeout(createNotes, 800);
        }

        // 页面加载后先启动祝福动画
        window.addEventListener('load', () => {
            startBlessingAnimation();
        });

        // 适配屏幕旋转
        window.addEventListener('resize', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
